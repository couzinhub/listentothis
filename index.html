<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>listen to this — a single recommendation, picked for you</title>
<style>
  :root {
    --bg: #0e0f13;
    --panel: #16181f;
    --panel-2: #1d2029;
    --text: #f3f3f1;
    --muted: #9aa0ad;
    --accent: #1db954;
    --accent-press: #169c46;
    --border: #2a2e3a;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(1200px 600px at 50% -10%, #1a1d27 0%, var(--bg) 55%);
    color: var(--text);
    font: 16px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
  }
  #stage { width: 100%; max-width: 560px; }
  .card {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 36px 34px 30px;
    box-shadow: 0 30px 80px rgba(0,0,0,.45);
  }
  .kicker {
    font-size: 12px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 6px;
  }
  h1 {
    font-size: 26px;
    line-height: 1.2;
    margin: 0 0 18px;
    font-weight: 650;
  }
  p { color: var(--muted); margin: 0 0 18px; }

  button {
    appearance: none;
    border: none;
    border-radius: 999px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    padding: 13px 22px;
    transition: background .15s ease, transform .05s ease, opacity .15s ease;
  }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .55; cursor: default; }
  .btn-primary { background: var(--accent); color: #07120a; }
  .btn-primary:hover:not(:disabled) { background: var(--accent-press); }
  .btn-ghost {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover:not(:disabled) { background: var(--panel-2); }

  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

  /* recommendation */
  .rec-card { display: flex; gap: 22px; align-items: center; }
  .rec-cover {
    width: 200px;
    height: 200px;
    flex: none;
    object-fit: cover;
    border-radius: 14px;
    box-shadow: 0 12px 30px rgba(0,0,0,.45);
  }
  .rec-info { flex: 1; min-width: 0; }
  .play-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 16px;
    background: var(--accent);
    color: #07120a;
    border-radius: 999px;
    padding: 11px 20px;
    font-weight: 600;
    font-size: 14px;
    text-decoration: none;
  }
  .play-btn:hover { background: var(--accent-press); }
  .below {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin-top: 18px;
  }
  .below .logout { align-self: flex-end; }
  @media (max-width: 460px) {
    .rec-card { flex-direction: column; align-items: flex-start; }
    .rec-cover { width: 100%; height: auto; aspect-ratio: 1 / 1; }
  }
  .rec-type {
    display: inline-block;
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid rgba(29,185,84,.4);
    border-radius: 999px;
    padding: 3px 11px;
    margin-bottom: 14px;
  }
  .rec-name { font-size: 28px; font-weight: 700; line-height: 1.18; margin: 0 0 4px; }
  .rec-artist { color: var(--muted); margin: 0; font-size: 16px; }
  .rec-reason {
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    margin: 0 0 22px;
    font-size: 15.5px;
    line-height: 1.6;
  }
  a.spotify-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
  }
  a.spotify-link:hover { text-decoration: underline; }

  .meta {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .link-btn {
    background: none; border: none; color: var(--muted);
    padding: 0; font: inherit; font-size: 13px; cursor: pointer; text-decoration: underline;
  }
  .link-btn:hover { color: var(--text); }

  .spinner {
    width: 22px; height: 22px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-row { display: flex; align-items: center; gap: 14px; color: var(--muted); }

  .error {
    background: rgba(255,107,107,.08);
    border: 1px solid rgba(255,107,107,.35);
    color: #ffc9c9;
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
    margin: 0 0 18px;
  }
  .hidden { display: none !important; }
  code { background: var(--panel-2); padding: 1px 6px; border-radius: 6px; font-size: 13px; }
</style>
</head>
<body>
  <main id="stage">
    <!-- views are swapped in by JS -->
  </main>

<script>
/* ============================================================================
   CONFIGURATION
   ----------------------------------------------------------------------------
   SPOTIFY_CLIENT_ID:  from https://developer.spotify.com/dashboard. It's public
                       (PKCE has no client secret). Save it in the lovelyco.de
                       dashboard as a PUBLIC env var named SPOTIFY_CLIENT_ID — the
                       app loads it at startup from /_lovely/env.js. In the Spotify
                       dashboard, register your Redirect URIs:
                         production:  https://listen-to-this.lovelyco.de/
                         local test:  http://127.0.0.1:5501/
                                      http://127.0.0.1:5501/index.html
                       (Spotify allows https:// or the http loopback 127.0.0.1 —
                       "localhost" is not accepted.)

   The ANTHROPIC API KEY is NOT here. Save it in the lovelyco.de dashboard as a
   SECRET env var named ANTHROPIC_API_KEY, and add `api.anthropic.com` under
   "Allowed API hosts". Claude is called via lovelyco's edge proxy (below): the
   browser sends the literal placeholder "{{ANTHROPIC_API_KEY}}" through
   /_lovely/proxy/..., and the edge substitutes the real key. The key is never
   sent to the browser, and the response stream is redacted for leaked secrets.
   ========================================================================== */
// Loaded at startup from lovelyco's /_lovely/env.js (see loadConfig). Set
// SPOTIFY_CLIENT_ID as a PUBLIC env var in the lovelyco.de dashboard.
let SPOTIFY_CLIENT_ID = "";

// Claude via lovelyco's edge proxy. CLAUDE_KEY is a placeholder that the edge
// replaces with the real ANTHROPIC_API_KEY secret as the request passes through
// the proxy — it is NOT the real key. Requires api.anthropic.com in "Allowed
// API hosts" (the proxy returns 403 otherwise).
const CLAUDE_URL = "/_lovely/proxy/api.anthropic.com/v1/messages";
const CLAUDE_KEY = "{{ANTHROPIC_API_KEY}}";
const CLAUDE_MODEL = "claude-sonnet-4-6";

const SPOTIFY_SCOPE = "user-library-read";
const REDIRECT_URI = window.location.origin + window.location.pathname;

// Pull public config (the Spotify Client ID) from lovelyco's env module. On
// lovelyco this returns the real value; locally (no /_lovely/env.js) it's skipped
// and SPOTIFY_CLIENT_ID stays empty, so the app shows a clear "not set" message.
async function loadConfig() {
  try {
    const env = await import("/_lovely/env.js");
    if (env.SPOTIFY_CLIENT_ID) SPOTIFY_CLIENT_ID = env.SPOTIFY_CLIENT_ID;
  } catch {
    /* /_lovely/env.js unavailable (e.g. a plain local static server) */
  }
}

// localStorage keys
const LS = {
  token: "ltt_spotify_token",
  refresh: "ltt_spotify_refresh",
  expiry: "ltt_spotify_expiry",
  verifier: "ltt_pkce_verifier",
  state: "ltt_oauth_state",
  library: "ltt_library_v1", // cached taste profile (JSON), so we don't re-read Spotify every load
};

/* ----------------------------- DOM helper ------------------------------- */
const stage = document.getElementById("stage");
function render(html) { stage.innerHTML = html; }

/* In-memory state for the session */
let library = null;            // cached pool of saved tracks + genres (see fetchLibrary)
const previousRecs = [];       // names already suggested, to avoid repeats

/* ============================================================================
   PKCE helpers
   ========================================================================== */
function base64url(bytes) {
  return btoa(String.fromCharCode(...new Uint8Array(bytes)))
    .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function randomString(byteLen) {
  const arr = new Uint8Array(byteLen);
  crypto.getRandomValues(arr);
  return base64url(arr.buffer);
}
async function sha256(str) {
  return crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
}

/* ============================================================================
   Spotify auth
   ========================================================================== */
async function beginLogin() {
  const verifier = randomString(64);            // ~86 chars, within 43–128
  const challenge = base64url(await sha256(verifier));
  const state = randomString(16);

  localStorage.setItem(LS.verifier, verifier);
  localStorage.setItem(LS.state, state);

  const params = new URLSearchParams({
    response_type: "code",
    client_id: SPOTIFY_CLIENT_ID,
    scope: SPOTIFY_SCOPE,
    redirect_uri: REDIRECT_URI,
    code_challenge_method: "S256",
    code_challenge: challenge,
    state,
  });
  window.location = "https://accounts.spotify.com/authorize?" + params.toString();
}

async function exchangeCodeForToken(code) {
  const verifier = localStorage.getItem(LS.verifier);
  if (!verifier) throw new Error("Missing PKCE verifier — please log in again.");

  const body = new URLSearchParams({
    grant_type: "authorization_code",
    code,
    redirect_uri: REDIRECT_URI,
    client_id: SPOTIFY_CLIENT_ID,
    code_verifier: verifier,
  });

  const res = await fetch("https://accounts.spotify.com/api/token", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body,
  });
  if (!res.ok) throw new Error("Spotify token exchange failed: " + (await res.text()));

  const data = await res.json();
  storeToken(data);
  localStorage.removeItem(LS.verifier);
}

async function refreshToken() {
  const refresh = localStorage.getItem(LS.refresh);
  if (!refresh) return false;

  const body = new URLSearchParams({
    grant_type: "refresh_token",
    refresh_token: refresh,
    client_id: SPOTIFY_CLIENT_ID,
  });
  const res = await fetch("https://accounts.spotify.com/api/token", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body,
  });
  if (!res.ok) return false;

  storeToken(await res.json());
  return true;
}

function storeToken(data) {
  localStorage.setItem(LS.token, data.access_token);
  if (data.refresh_token) localStorage.setItem(LS.refresh, data.refresh_token);
  // refresh 60s before actual expiry
  localStorage.setItem(LS.expiry, String(Date.now() + (data.expires_in - 60) * 1000));
}

function getValidTokenOrNull() {
  const token = localStorage.getItem(LS.token);
  const expiry = Number(localStorage.getItem(LS.expiry) || 0);
  if (token && Date.now() < expiry) return token;
  return null;
}

function logout() {
  Object.values(LS).forEach((k) => localStorage.removeItem(k));
  window.location = REDIRECT_URI; // reload clean
}

function clearTokens() {
  [LS.token, LS.refresh, LS.expiry].forEach((k) => localStorage.removeItem(k));
}

/* ============================================================================
   Spotify data fetch
   ========================================================================== */
async function spotifyGet(path) {
  let token = getValidTokenOrNull();
  if (!token) {
    const refreshed = await refreshToken();
    if (!refreshed) throw new Error("AUTH_EXPIRED");
    token = localStorage.getItem(LS.token);
  }

  let res = await fetch("https://api.spotify.com/v1" + path, {
    headers: { Authorization: "Bearer " + token },
  });

  // Token rejected mid-session → try one refresh, then retry
  if (res.status === 401) {
    const refreshed = await refreshToken();
    if (!refreshed) throw new Error("AUTH_EXPIRED");
    res = await fetch("https://api.spotify.com/v1" + path, {
      headers: { Authorization: "Bearer " + localStorage.getItem(LS.token) },
    });
  }
  // 403 = the stored token predates the user-library-read scope. A refresh keeps
  // the same scopes, so force a fresh login to re-prompt for library access.
  if (res.status === 403) throw new Error("INSUFFICIENT_SCOPE");
  if (!res.ok) throw new Error("Spotify API error (" + res.status + "): " + (await res.text()));
  return res.json();
}

async function fetchLibrary() {
  const PAGE = 50;
  const POOL_TARGET = 1500; // tracks to keep in the cached pool

  // First page tells us how big the library is.
  const first = await spotifyGet(`/me/tracks?limit=${PAGE}&offset=0`);
  const total = first.total || (first.items || []).length;

  // Sample pages spread evenly across the WHOLE library. /me/tracks is
  // newest-first, so reading only the front would reintroduce recency bias —
  // instead we step across the full offset range.
  const pagesNeeded = Math.max(1, Math.min(Math.ceil(POOL_TARGET / PAGE), Math.ceil(total / PAGE)));
  const lastOffset = Math.max(0, total - PAGE);
  const offsets = new Set([0]);
  for (let i = 1; i < pagesNeeded; i++) {
    const raw = Math.round((lastOffset * i) / (pagesNeeded - 1));
    offsets.add(raw - (raw % PAGE)); // align to a page boundary
  }

  // Fetch remaining pages in small concurrent batches (stay clear of rate limits).
  const pages = [first];
  const others = [...offsets].filter((o) => o !== 0);
  for (let i = 0; i < others.length; i += 6) {
    const chunk = others.slice(i, i + 6);
    pages.push(...(await Promise.all(chunk.map((o) => spotifyGet(`/me/tracks?limit=${PAGE}&offset=${o}`)))));
  }

  // De-dupe into a pool of { name, artists[] }, and tally artist frequency by id.
  const seen = new Set();
  const pool = [];
  const artistFreq = new Map(); // id -> { name, count }
  for (const p of pages) {
    for (const it of p.items || []) {
      const t = it.track;
      if (!t || !t.id || seen.has(t.id)) continue;
      seen.add(t.id);
      pool.push({ name: t.name, artists: (t.artists || []).map((a) => a.name) });
      (t.artists || []).forEach((a) => {
        if (!a.id) return;
        const e = artistFreq.get(a.id) || { name: a.name, count: 0 };
        e.count++;
        artistFreq.set(a.id, e);
      });
    }
  }

  // Genres live on the artist object — fetch them for the most-frequent artists
  // (the ones most likely to surface in any random sample). 1-2 batched calls.
  const topIds = [...artistFreq.entries()]
    .sort((a, b) => b[1].count - a[1].count)
    .slice(0, 100)
    .map(([id]) => id);
  const genreByName = {};
  for (let i = 0; i < topIds.length; i += 50) {
    try {
      const ar = await spotifyGet("/artists?ids=" + topIds.slice(i, i + 50).join(","));
      (ar.artists || []).forEach((a) => { if (a && a.genres && a.genres.length) genreByName[a.name] = a.genres; });
    } catch { /* genres are a nice-to-have */ }
  }

  library = { pool, genreByName, libraryTotal: total };
  saveLibraryCache();
}

// Build the prompt text from a NEW random sample of the cached pool, so every
// recommendation draws on a different slice of the library.
function buildTasteProfile() {
  const { pool, genreByName, libraryTotal } = library;
  const SAMPLE = 600;

  // Partial Fisher–Yates shuffle, then take the first SAMPLE entries.
  const idx = pool.map((_, i) => i);
  for (let i = idx.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [idx[i], idx[j]] = [idx[j], idx[i]];
  }
  const sample = idx.slice(0, Math.min(SAMPLE, pool.length)).map((i) => pool[i]);

  // Artist frequency within this sample.
  const count = new Map();
  sample.forEach((t) => t.artists.forEach((n) => count.set(n, (count.get(n) || 0) + 1)));
  const topArtists = [...count.entries()].sort((a, b) => b[1] - a[1]).slice(0, 40);

  // Dominant genres from the cached genre map.
  const gCount = new Map();
  topArtists.forEach(([n, c]) => (genreByName[n] || []).forEach((g) => gCount.set(g, (gCount.get(g) || 0) + c)));
  const topGenres = [...gCount.entries()].sort((a, b) => b[1] - a[1]).slice(0, 25).map(([g]) => g);

  const artistLines = topArtists.map(([n, c], i) =>
    `${i + 1}. ${n} — ${c} track${c === 1 ? "" : "s"}` + (genreByName[n] ? " — " + genreByName[n].join(", ") : "")
  );
  const trackLines = sample.slice(0, 30).map((t, i) => `${i + 1}. ${t.name} — ${t.artists.join(", ")}`);

  return `LISTENER'S SAVED LIBRARY (Spotify) — ${libraryTotal} saved tracks total.\n\n` +
    "Most-saved artists in this slice (with genres):\n" + artistLines.join("\n") +
    "\n\nDominant genres: " + (topGenres.length ? topGenres.join(", ") : "(unavailable)") +
    "\n\nA spread of tracks from the library:\n" + trackLines.join("\n");
}

/* ============================================================================
   Library cache — store the pool as JSON in localStorage so we don't re-read
   the whole Spotify library on every load. (A static site can't write a
   server-side file; this is the browser-side equivalent. Logging out clears it.)
   ========================================================================== */
function saveLibraryCache() {
  try { localStorage.setItem(LS.library, JSON.stringify(library)); }
  catch { /* storage full/unavailable — caching is best-effort */ }
}

function loadLibraryCache() {
  try {
    const c = JSON.parse(localStorage.getItem(LS.library) || "null");
    if (!c || !Array.isArray(c.pool) || !c.pool.length) return false;
    library = c;
    return true;
  } catch { return false; }
}

// Look up cover art + a direct Spotify link for the recommendation (search needs
// no special scope). Falls back to no image / a search link if nothing matches.
async function fetchCover(rec) {
  try {
    const type = rec.type === "album" ? "album" : "artist";
    const q = type === "album" && rec.artist && rec.artist !== rec.name
      ? `${rec.artist} ${rec.name}` : rec.name;
    const data = await spotifyGet(`/search?q=${encodeURIComponent(q)}&type=${type}&limit=1`);
    const item = type === "album" ? data.albums?.items?.[0] : data.artists?.items?.[0];
    if (item) {
      return {
        imageUrl: (item.images && item.images[0] && item.images[0].url) || "",
        webUrl: (item.external_urls && item.external_urls.spotify) || "",
        uri: item.uri || "", // spotify:album:... / spotify:artist:... → opens the desktop app
      };
    }
  } catch { /* fall back to a plain search link below */ }
  return { imageUrl: "", webUrl: "", uri: "" };
}

/* ============================================================================
   Claude recommendation.
   The request is sent through lovelyco's edge proxy (CLAUDE_URL), which swaps
   the "{{ANTHROPIC_API_KEY}}" placeholder for the real key server-side. The
   prompt is built here in the browser, which is fine — it contains no secret.
   ========================================================================== */
const SYSTEM_INSTRUCTIONS =
  "You are a discerning music curator with deep, wide-ranging knowledge across " +
  "genres, eras, scenes, and the long tail of music. You will be given a listener's " +
  "taste profile. Analyze it for patterns: genre, mood, era, instrumentation, " +
  "production style, and how obscure vs. mainstream their taste runs. Then recommend " +
  "exactly ONE specific album or artist they most likely have NOT already heard. " +
  "Avoid obvious or mainstream suggestions, and avoid anything that merely duplicates " +
  "what they already listen to — make a thoughtful lateral move that genuinely fits " +
  "the through-line of their taste.\n\n" +
  "Respond with ONLY a JSON object — no markdown, no code fence, no preamble — in " +
  'exactly this shape:\n' +
  '{"name": "<album or artist name>", "type": "album" | "artist", ' +
  '"artist": "<the artist name, for searching>"}';

async function getRecommendation() {
  // Fresh random sample of the cached library on every call → different slice,
  // different recommendation. (The block varies, so it isn't prompt-cached.)
  const tasteProfile = buildTasteProfile();

  const avoidClause = previousRecs.length
    ? "\n\nDo NOT recommend any of these (already suggested) — pick something different:\n- " +
      previousRecs.join("\n- ")
    : "";

  const requestBody = {
    model: CLAUDE_MODEL,
    max_tokens: 1024,
    temperature: 1, // variety across repeated "give me another" calls
    system: [
      { type: "text", text: SYSTEM_INSTRUCTIONS },
      { type: "text", text: tasteProfile },
    ],
    messages: [
      { role: "user", content: "Give me one recommendation for this listener." + avoidClause },
    ],
  };

  const res = await fetch(CLAUDE_URL, {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": CLAUDE_KEY, // placeholder; substituted at the edge
      "anthropic-version": "2023-06-01",
      // The proxy forwards the browser's Origin header, so Anthropic treats this
      // as a CORS request and requires this flag. (No secret — just enables CORS.)
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify(requestBody),
  });

  if (!res.ok) throw new Error("Claude API error (" + res.status + "): " + (await res.text()));

  const data = await res.json();
  const text = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("");
  const rec = parseRecJSON(text);
  if (rec && rec.name) previousRecs.push(rec.name);
  return { rec, raw: text };
}

function parseRecJSON(text) {
  // Tolerant: grab the outermost {...} in case the model adds stray text.
  const start = text.indexOf("{");
  const end = text.lastIndexOf("}");
  if (start === -1 || end === -1) return null;
  try {
    return JSON.parse(text.slice(start, end + 1));
  } catch {
    return null;
  }
}

/* ============================================================================
   Views
   ========================================================================== */
function viewLogin(note) {
  render(`
    <div class="card">
      <p class="kicker">listen to this</p>
      <h1>One album. Picked for your ears.</h1>
      <p>Connect Spotify and Claude will study your saved library, then hand you a
         single off-the-radar recommendation — with a short note on why it fits.</p>
      ${note ? `<div class="error">${escapeHtml(note)}</div>` : ""}
      <div class="row">
        <button class="btn-primary" id="login">Connect Spotify</button>
      </div>
    </div>
  `);
  document.getElementById("login").onclick = () => {
    if (!SPOTIFY_CLIENT_ID) {
      viewError("SPOTIFY_CLIENT_ID is not set. Add it as a Public env var in the lovelyco.de dashboard.");
      return;
    }
    beginLogin();
  };
}

function viewLoading(message) {
  render(`
    <div class="card">
      <p class="kicker">listen to this</p>
      <div class="loading-row"><div class="spinner"></div><span>${message}</span></div>
    </div>
  `);
}

function viewError(message) {
  render(`
    <div class="card">
      <p class="kicker">listen to this</p>
      <h1>Something went sideways</h1>
      <div class="error">${escapeHtml(message)}</div>
      <div class="row">
        <button class="btn-ghost" id="retry">Try again</button>
        <button class="link-btn" id="reset">Reset &amp; log out</button>
      </div>
    </div>
  `);
  document.getElementById("retry").onclick = boot;
  document.getElementById("reset").onclick = logout;
}

function viewRecommendation(rec, raw, cover) {
  cover = cover || { imageUrl: "", webUrl: "", uri: "" };

  if (!rec) {
    // Parsing failed — show Claude's raw text so nothing is hidden from the user.
    render(`
      <div class="card">
        <h1>Here's what Claude said</h1>
        <div class="rec-reason">${escapeHtml(raw || "(empty response)")}</div>
      </div>
      <div class="below">
        <button class="btn-ghost" id="again">Give me another</button>
        <button class="link-btn logout" id="reset">Log out</button>
      </div>
    `);
    wireAgain();
    document.getElementById("reset").onclick = logout;
    return;
  }

  // Prefer the spotify: URI so it opens the desktop app if installed; fall back
  // to the web URL, then a search link. URIs are protocol handlers — opening them
  // in a new tab would leave a blank tab, so only web links get target=_blank.
  const fallbackSearch = "https://open.spotify.com/search/" + encodeURIComponent(
    rec.type === "album" && rec.artist ? `${rec.artist} ${rec.name}` : rec.name
  );
  const playHref = cover.uri || cover.webUrl || fallbackSearch;
  const targetAttr = playHref.startsWith("spotify:") ? "" : ` target="_blank" rel="noopener"`;

  render(`
    <div class="card rec-card">
      ${cover.imageUrl
        ? `<img class="rec-cover" src="${cover.imageUrl}" alt="${escapeHtml(rec.name)} cover art" />`
        : ""}
      <div class="rec-info">
        <h2 class="rec-name">${escapeHtml(rec.name)}</h2>
        ${rec.artist && rec.artist !== rec.name
          ? `<p class="rec-artist">${escapeHtml(rec.artist)}</p>` : ""}
        <a class="play-btn" href="${playHref}"${targetAttr}>▶ Play</a>
      </div>
    </div>
    <div class="below">
      <button class="btn-ghost" id="again">Give me another</button>
      <button class="link-btn logout" id="reset">Log out</button>
    </div>
  `);
  wireAgain();
  document.getElementById("reset").onclick = logout;
}

function wireAgain() {
  const btn = document.getElementById("again");
  if (btn) btn.onclick = requestAndShow;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ============================================================================
   Flow orchestration
   ========================================================================== */
async function requestAndShow() {
  viewLoading("Consulting Claude…");
  try {
    const { rec, raw } = await getRecommendation();
    const cover = rec && rec.name ? await fetchCover(rec) : { imageUrl: "", spotifyUrl: "" };
    viewRecommendation(rec, raw, cover);
  } catch (e) {
    viewError(e.message || String(e));
  }
}

async function boot() {
  await loadConfig();
  if (!SPOTIFY_CLIENT_ID) {
    viewError("SPOTIFY_CLIENT_ID is not set. Add it as a Public env var named " +
              "SPOTIFY_CLIENT_ID in the lovelyco.de dashboard.");
    return;
  }

  const url = new URL(window.location.href);
  const code = url.searchParams.get("code");
  const returnedState = url.searchParams.get("state");
  const oauthError = url.searchParams.get("error");

  if (oauthError) {
    viewError("Spotify authorization was denied or failed: " + oauthError);
    return;
  }

  // Returning from Spotify with an auth code
  if (code) {
    const savedState = localStorage.getItem(LS.state);
    if (!savedState || savedState !== returnedState) {
      viewError("OAuth state mismatch — possible tampering. Please log in again.");
      return;
    }
    viewLoading("Finishing sign-in…");
    try {
      await exchangeCodeForToken(code);
      localStorage.removeItem(LS.state);
      // Clean the ?code=... out of the URL
      window.history.replaceState({}, document.title, REDIRECT_URI);
    } catch (e) {
      viewError(e.message || String(e));
      return;
    }
  }

  // Need a valid (or refreshable) token to proceed
  if (!getValidTokenOrNull()) {
    const refreshed = await refreshToken();
    if (!refreshed) { viewLogin(); return; }
  }

  // Authenticated → load the library (from cache if available) once, then recommend
  try {
    if (!library && !loadLibraryCache()) {
      viewLoading("Reading your Spotify library…");
      await fetchLibrary();
    }
    await requestAndShow();
  } catch (e) {
    if (e.message === "AUTH_EXPIRED") { viewLogin(); return; }
    if (e.message === "INSUFFICIENT_SCOPE") {
      clearTokens();
      viewLogin("This now reads your Liked Songs — please reconnect Spotify to grant access.");
      return;
    }
    viewError(e.message || String(e));
  }
}

boot();
</script>
</body>
</html>
